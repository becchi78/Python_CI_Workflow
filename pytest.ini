[pytest]
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts = -v -ra -q --cov=functions --cov-report=term-missing
pythonpath = .

[coverage:run]
branch = True
source = functions

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
fail_under = 80
