name: Python Test

on:
  push:
    branches:
      - "feature/*"
      - "fix/*"

jobs:
  python_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements_test_tools.txt
          pip install -r tests/requirements.txt

      - name: Lint with flake8
        id: flake8
        continue-on-error: true
        run: |
          # PEP 8 style guide checking
          flake8 functions/ --count --max-complexity=10 --max-line-length=100 --statistics

      - name: Static type checking with mypy
        id: mypy
        continue-on-error: true
        run: |
          mypy functions/ --strict

      - name: Run tests with pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest tests/ -v

    - name: test results
      if: always()
      run: |
        if [[ "${{ steps.flake8.outcome }}" == "failure" ]] || \
          [[ "${{ steps.mypy.outcome }}" == "failure" ]] || \
          [[ "${{ steps.pytest.outcome }}" == "failure" ]]; then
          echo "test failed"
          exit 1
        fi
