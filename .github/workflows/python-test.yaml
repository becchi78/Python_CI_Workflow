name: Python Test

on:
  push:
    branches:
      - "feature/*"
      - "fix/*"

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements_test_tools.txt
          pip install -r tests/requirements.txt

      - name: Lint with flake8
        id: flake8
        run: |
          # PEP 8 style guide checking
          flake8 functions/ --count --max-complexity=10 --max-line-length=100 --statistics || echo "failed=true" >> $GITHUB_OUTPUT

      - name: Static type checking with mypy
        id: mypy
        run: |
          mypy functions/ --strict || echo "failed=true" >> $GITHUB_OUTPUT

      - name: Run tests with pytest
        id: pytest
        run: |
          pytest tests/ -v || echo "failed=true" >> $GITHUB_OUTPUT

      - name: test results
        if: always()
        run: |
          if [[ "${{ steps.flake8.outputs.failed }}" == "true" ]] || \
             [[ "${{ steps.mypy.outputs.failed }}" == "true" ]] || \
             [[ "${{ steps.pytest.outputs.failed }}" == "true" ]]; then
            echo "One or more tests failed"
            exit 1
          fi
