name: Python Test

on:
  push:
    branches:
      - "feature/*"
      - "fix/*"

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements_test_tools.txt
          pip install -r tests/requirements.txt

      - name: Lint with flake8
        id: flake8
        continue-on-error: true
        run: |
          if ! flake8 functions/; then
            echo "error=Lint check failed" >> $GITHUB_OUTPUT
          fi

      - name: Static type checking with mypy
        continue-on-error: true
        id: mypy
        run: |
          if ! mypy functions/; then
            echo "error=mypy check failed" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with pytest
        continue-on-error: true
        id: pytest
        run: |
          if ! pytest tests/; then
            echo "error=pytest check failed" >> $GITHUB_OUTPUT
          fi

      - name: Check coverage threshold
        continue-on-error: true
        id: coverage
        run: |
          if ! coverage report --fail-under=80; then
            echo "error=Coverage is below 80%" >> $GITHUB_OUTPUT
          fi

      - name: test results
        if: always()
        run: |
          failed_steps=()

          if [[ "${{ steps.flake8.outputs.error }}" ]]; then
            failed_steps+=("${{ steps.flake8.outputs.error }}")
          fi

          if [[ "${{ steps.mypy.outputs.error }}" ]]; then
            failed_steps+=("${{ steps.mypy.outputs.error }}")
          fi

          if [[ "${{ steps.pytest.outputs.error }}" ]]; then
            failed_steps+=("${{ steps.pytest.outputs.error }}")
          fi

          if [[ "${{ steps.coverage.outputs.error }}" ]]; then
            failed_steps+=("${{ steps.coverage.outputs.error }}")
          fi

          if [ ${#failed_steps[@]} -ne 0 ]; then
            echo "Following checks failed:"
            printf '%s\n' "${failed_steps[@]}"
            exit 1
          fi
